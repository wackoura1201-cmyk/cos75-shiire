<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="cache-control" content="no-cache">
<title>仕入れ画面</title>
<style>body{font-family:sans-serif;padding:24px;line-height:1.7;color:#222}h1{font-size:20px}</style>
</head>
<body>
<h1>仕入れ画面を開いています…</h1>
<p id="msg">このまま少しお待ちください。</p>
<script>
// 仕入れ画面の固定URL。Mac mini の仮URL（毎回変わる）を url.txt に置き、そこへ飛ばす。
// url.txt は Mac mini が仮URLが変わるたびに書き換える（purchase/publish_url.sh）。
fetch("url.txt?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.text(); })
  .then(function (t) {
    var u = t.trim();
    if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)) { location.replace(u + "/"); return; }
    throw new Error("bad");
  })
  .catch(function () {
    document.getElementById("msg").textContent = "つながりませんでした。数分おいて開き直してください。直らないときは浦さんに連絡してください。";
  });
</script>
</body>
</html>
